<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parkwood Properties — Form Detection</title>
  </head>
  <body>
    <!-- Netlify Forms detection stubs. Real UI submits via AJAX to this path. -->

    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="inquiryType" />
      <textarea name="message"></textarea>
    </form>

    <form name="appraisal" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="location" />
      <input name="propertyType" />
      <input name="requestType" />
      <textarea name="propertyDetails"></textarea>
      <textarea name="message"></textarea>
    </form>

    <form name="launches" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" />
      <input name="email" type="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
    </form>

    <form name="feedback" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" />
      <input name="email" type="email" />
      <textarea name="feedback"></textarea>
    </form>

    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" type="email" />
    </form>
  </body>
</html>
